name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # package-lock.json is gitignored, so `npm ci` is not available.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Build the CLI bundle
        run: npm run build:cli
      - name: Smoke-test the bundle (no database needed)
        shell: bash
        run: |
          node cli/dist/neon-sync.cjs --version
          node cli/dist/neon-sync.cjs --help > /dev/null
          node cli/dist/neon-sync.cjs status --json --config "$RUNNER_TEMP/none.json"

  package:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run compile
      - name: List VSIX files
        run: npx --yes @vscode/vsce ls | tee vsix-files.txt
      - name: No source maps or dev-only dependencies in the VSIX
        run: |
          if grep -E '\.map$|node_modules/@electric-sql/' vsix-files.txt; then
            echo "::error::Unexpected files in the VSIX (see above)"
            exit 1
          fi
          grep -q '^out/core/engine.js$' vsix-files.txt || { echo "::error::out/core missing from the VSIX"; exit 1; }
          if grep -E '^cli/' vsix-files.txt; then echo "::error::cli/ files in the VSIX"; exit 1; fi
      - name: npm package contents (dry run, never published here)
        working-directory: cli
        run: |
          npm pack --dry-run --json > ../pack.json
          node -e "
            const files = JSON.parse(require('fs').readFileSync('../pack.json', 'utf-8'))[0].files.map((f) => f.path).sort();
            const expected = ['LICENSE', 'README.md', 'dist/neon-sync.cjs', 'package.json'];
            if (JSON.stringify(files) !== JSON.stringify(expected)) { console.error('unexpected package files:', files); process.exit(1); }
            console.log('package files:', files.join(', '));"
      # The oldest Node the package claims (engines), with the bundle just built
      # by prepack: bundled dependencies (e.g. @clack/prompts) set this floor.
      - uses: actions/setup-node@v5
        with:
          node-version: '20.12.0'
      - name: Smoke-test the bundle on the oldest supported Node
        run: |
          node --version
          node cli/dist/neon-sync.cjs --version
          node cli/dist/neon-sync.cjs --help > /dev/null
          node cli/dist/neon-sync.cjs status --json --config "$RUNNER_TEMP/none.json"

